spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: campushub
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB}}
    username: ${JDBC_USER:${POSTGRES_USER}}
    password: ${JDBC_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Solo para la practica: en produccion usar migraciones
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/campushub}
    auto-index-creation: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
server:
  port: ${PORT:8080}
